name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lista los commits del PR via la API. En un repo publico le
  # bastaba `contents: read`; desde que el repo es privado necesita este permiso
  # explicito o falla con 403 "Resource not accessible by integration" — y falla
  # SIN escanear, que es lo peligroso: parece un hallazgo y no lo es.
  pull-requests: read

jobs:
  lint-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      # mypy llevaba configurado en pyproject.toml sin que ningun step lo
      # invocara. En codigo que habla por red y maneja credenciales, un tipo mal
      # puesto es justo donde duele.
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # gitleaks busca CREDENCIALES. No busca lo que de verdad se filtro en este
  # proyecto: topologia de red interna, nombres de base de datos y nombres de
  # cliente. Este job cubre ese hueco, y se prueba a si mismo antes de confiar en
  # el: un guardia que nunca falla no protege de nada.
  leak-guard:
    name: Leak guard (topologia interna)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El guardia detecta una sonda
        run: |
          mkdir -p docs/_probe && printf 'host 10.1.2.3\n' > docs/_probe/p.md
          git add -N docs/_probe/p.md
          if bash .github/scripts/leak_guard.sh; then
            echo "::error::leak_guard no detecto la sonda — el guardia esta roto"
            exit 1
          fi
          rm -rf docs/_probe
      - name: El arbol esta limpio
        run: bash .github/scripts/leak_guard.sh
